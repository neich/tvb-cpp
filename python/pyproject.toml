[project]
name = "tvbcpp"
version = "0.0.5"
description = "C++ backend for the The Virtuabl Brain framework"
license = {text = "MIT License"}
authors = [
    {name = "Ignacio Martín", email = "natx.mc@gmail.com"},
]
requires-python = ">=3.6"

[build-system]
requires = [
    "setuptools>=42",
    "pybind11~=2.9.2",
    "cmake>=3.22",
    "scikit-build>=0.15.0",
]

build-backend = "setuptools.build_meta"

[tool.isort]
profile = "black"

[tool.cibuildwheel]
test-command = "pytest {project}/tests"
test-extras = ["test"]
test-skip = ["*universal2:arm64"]

[tool.cibuildwheel.linux]
before-all = "yum install -y boost-devel cmake"
before-build = [
"curl -O https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.bz2",
    "tar -xvf eigen-3.4.0.tar.bz2",
    "cd eigen-3.4.0",
    "mkdir build",
    "cd build",
    "cmake ../",
    "make install"
]